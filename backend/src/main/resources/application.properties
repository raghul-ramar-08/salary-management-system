spring.application.name=salary-management
spring.datasource.url=jdbc:h2:mem:salarydb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.output.ansi.enabled=ALWAYS
logging.file.name=logs/salary-management.log
logging.file.max-size=20MB
logging.file.max-history=7

# Minimal debug logging for application
logging.level.com.acme.salary=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.orm.jpa=INFO
logging.level.org.springframework.data=INFO
logging.level.com.zaxxer.hikari=INFO
