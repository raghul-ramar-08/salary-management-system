spring.application.name=salary-management
spring.datasource.url=jdbc:h2:mem:salarydb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.output.ansi.enabled=ALWAYS
logging.file.name=logs/salary-management.log
logging.file.max-size=20MB
logging.file.max-history=7

# Detailed debug logging across all backend layers
logging.level.com.acme.salary=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.springframework.data=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
